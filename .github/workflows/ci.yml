name: CI/CD Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  # ==========================================
  # 1. Backend Lint, Prisma Validate & Build
  # ==========================================
  backend-ci:
    name: Backend Test & Build
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ./backend

    env:
      DATABASE_URL: "postgresql://postgres:postgres@localhost:5432/test_db?schema=public"

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: './backend/package-lock.json'

      - name: Install Dependencies
        run: npm ci

      - name: Validate Prisma Schema
        run: npx prisma validate

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Compile TypeScript
        run: npm run build

  # ==========================================
  # 2. Frontend Lint, Typecheck & Standalone Build
  # ==========================================
  frontend-ci:
    name: Frontend Test & Build
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ./frontend

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: './frontend/package-lock.json'

      - name: Install Dependencies
        run: npm ci

      - name: TypeScript Type-Check
        run: npx tsc --noEmit

      - name: Build Next.js Application
        run: npm run build
        env:
          NEXT_PUBLIC_API_URL: http://localhost:5001/api
          NEXT_TELEMETRY_DISABLED: 1

  # ==========================================
  # 3. Docker Container Build Verification
  # ==========================================
  docker-build:
    name: Docker Container Validation
    needs: [ backend-ci, frontend-ci ]
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Backend Docker Image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: false
          tags: portfolio-backend:test

      - name: Build Frontend Docker Image
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: false
          tags: portfolio-frontend:test
          build-args: |
            NEXT_PUBLIC_API_URL=http://localhost:5001/api

  # ==========================================
  # 4. Continuous Deployment to Hetzner VPS
  # ==========================================
  deploy:
    name: Continuous Deployment (CD)
    needs: [ backend-ci, frontend-ci, docker-build ]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to Hetzner VPS via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: 22
          script_stop: true
          script: |
            echo "🚀 Starting automated deployment on VPS..."
            cd /var/www/my-portfolio
            
            echo "📥 Pulling latest commits from main..."
            git pull origin main
            
            echo "🔄 Building and recreating updated containers..."
            docker compose up -d --build
            
            echo "🧹 Pruning unused dangling images to free disk..."
            docker image prune -f
            
            echo "✅ Deployment completed successfully!"

      - name: Verify Live Production Health
        run: |
          echo "🔍 Verifying live production site health..."
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" https://tharushasangeeth.live)
          if [ "$STATUS" -eq 200 ] || [ "$STATUS" -eq 301 ]; then
            echo "✅ Live portfolio is up and running! (HTTP $STATUS)"
          else
            echo "⚠️ Warning: Live site returned HTTP $STATUS"
            exit 1
          fi
