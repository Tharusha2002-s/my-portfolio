<svg viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- White Background Squircle with Soft Border -->
  <rect x="3" y="3" width="94" height="94" rx="24" fill="#ffffff" stroke="#e5e5ea" stroke-width="4"/>
  
  <!-- High Contrast Black Monogram: Big T + Smaller S -->
  <text x="48" y="67" text-anchor="middle" font-family="'Geist', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
    <tspan font-size="54" font-weight="900" fill="#18181b">T</tspan>
    <tspan font-size="34" font-weight="800" dx="1" dy="-12" fill="#18181b">S</tspan>
  </text>
</svg>
