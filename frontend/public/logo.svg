<svg viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="tsGradPrimary" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00e5ff" />
      <stop offset="50%" stop-color="#00c8ff" />
      <stop offset="100%" stop-color="#0077b6" />
    </linearGradient>
    <linearGradient id="tsGradAccent" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#80e5ff" />
    </linearGradient>
    <linearGradient id="tsBgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d1117" />
      <stop offset="100%" stop-color="#080c10" />
    </linearGradient>
    <filter id="neonCyanGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Outer Tech Squircle Background -->
  <rect
    x="4"
    y="4"
    width="92"
    height="92"
    rx="22"
    fill="url(#tsBgGrad)"
    stroke="#1e2d3d"
    stroke-width="2.5"
  />

  <!-- Ambient Corner Crosshairs / Cyber Accents -->
  <path d="M 14 24 L 14 14 L 24 14" stroke="#00c8ff" stroke-width="2" stroke-linecap="round" opacity="0.7"/>
  <path d="M 86 76 L 86 86 L 76 86" stroke="#00c8ff" stroke-width="2" stroke-linecap="round" opacity="0.7"/>

  <!-- 'T' Pillar with Apex Arrowhead -->
  <path d="M 50 18 L 62 26 L 54 26 L 54 52 L 46 52 L 46 26 L 38 26 Z" fill="url(#tsGradPrimary)" opacity="0.95"/>
  <path d="M 50 50 L 50 82" stroke="url(#tsGradPrimary)" stroke-width="6" stroke-linecap="round"/>

  <!-- 'S' Flow Ribbon Weaving Interlocked through the T -->
  <path
    d="M 68 34 C 68 28 62 24 50 24 C 36 24 30 30 30 38 C 30 46 40 48 54 51 C 66 54 70 59 70 66 C 70 75 62 79 48 79 C 34 79 28 73 28 66"
    stroke="url(#tsGradAccent)"
    stroke-width="6"
    stroke-linecap="round"
    stroke-linejoin="round"
    filter="url(#neonCyanGlow)"
  />

  <!-- Terminal Dot Nodes -->
  <circle cx="68" cy="34" r="3.5" fill="#00e5ff" />
  <circle cx="28" cy="66" r="3.5" fill="#38bdf8" />
</svg>
