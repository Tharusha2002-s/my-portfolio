<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f8f9fa"/>
      <stop offset="100%" stop-color="#e9ecef"/>
    </linearGradient>
    <linearGradient id="heroCardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#fdfdfd"/>
    </linearGradient>
    <linearGradient id="avatarGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e0e7ff"/>
      <stop offset="100%" stop-color="#ede9fe"/>
    </linearGradient>
    <filter id="cardShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.06"/>
    </filter>
    <filter id="floatShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000000" flood-opacity="0.08"/>
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="800" height="500" rx="20" fill="url(#bgGrad)"/>

  <!-- Browser Frame Header -->
  <rect x="24" y="20" width="752" height="42" rx="12" fill="#ffffff" stroke="#e5e5ea" stroke-width="1"/>
  <circle cx="46" cy="41" r="5" fill="#ff5f56"/>
  <circle cx="62" cy="41" r="5" fill="#ffbd2e"/>
  <circle cx="78" cy="41" r="5" fill="#27c93f"/>

  <!-- URL Address Bar -->
  <rect x="230" y="27" width="340" height="28" rx="8" fill="#f4f4f6" stroke="#e5e5ea" stroke-width="1"/>
  <text x="400" y="45" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#71717a" text-anchor="middle" font-weight="500">🔒 https://tharushasangeeth.live</text>

  <!-- Status indicator on right -->
  <rect x="680" y="30" width="80" height="22" rx="11" fill="#ecfdf5" stroke="#a7f3d0" stroke-width="1"/>
  <circle cx="693" cy="41" r="3.5" fill="#10b981"/>
  <text x="732" y="45" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" fill="#047857" text-anchor="middle" font-weight="600">LIVE</text>

  <!-- Main Website Mockup Container -->
  <g transform="translate(24, 74)">
    <!-- Site Canvas -->
    <rect width="752" height="406" rx="16" fill="#f4f4f6"/>

    <!-- Mini Navigation Bar -->
    <g transform="translate(30, 20)">
      <text x="0" y="16" font-family="monospace" font-size="13" font-weight="800" letter-spacing="2" fill="#18181b">THARUSHA</text>
      <text x="490" y="16" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="10.5" fill="#71717a" font-weight="500">LinkedIn  /  GitHub  /  Services  /  Projects  /  Contact</text>
    </g>

    <!-- Hero Card Mockup -->
    <rect x="30" y="48" width="692" height="268" rx="24" fill="url(#heroCardGrad)" stroke="#e5e5ea" stroke-width="1" filter="url(#cardShadow)"/>

    <!-- Left Side: Typography -->
    <g transform="translate(60, 78)">
      <!-- Availability Pill -->
      <rect x="0" y="0" width="168" height="24" rx="12" fill="#f4f4f6" stroke="#e5e5ea" stroke-width="1"/>
      <circle cx="14" cy="12" r="3.5" fill="#10b981"/>
      <text x="94" y="15.5" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="9.5" fill="#52525b" font-weight="600" text-anchor="middle">Available for opportunities 👋</text>

      <!-- Headline -->
      <text x="0" y="52" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="21" font-weight="800" fill="#18181b" letter-spacing="-0.5">
        Building scalable systems,
      </text>
      <text x="0" y="78" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="21" font-weight="800" fill="#18181b" letter-spacing="-0.5">
        intelligent AI, and web experiences.
      </text>

      <!-- Subtitle -->
      <text x="0" y="112" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" fill="#71717a" font-weight="400">
        Software Engineering undergraduate &amp; DevOps enthusiast crafting
      </text>
      <text x="0" y="128" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" fill="#71717a" font-weight="400">
        resilient full-stack applications with Next.js, Docker &amp; Python.
      </text>

      <!-- Buttons -->
      <rect x="0" y="152" width="105" height="32" rx="16" fill="#18181b"/>
      <text x="52" y="172" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="10.5" fill="#ffffff" font-weight="600" text-anchor="middle">Latest Work ↗</text>

      <rect x="115" y="152" width="100" height="32" rx="16" fill="#ffffff" stroke="#e5e5ea" stroke-width="1"/>
      <text x="165" y="172" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="10.5" fill="#18181b" font-weight="600" text-anchor="middle">View Resume ↗</text>
    </g>

    <!-- Right Side: Circular Avatar Mockup -->
    <g transform="translate(530, 85)">
      <circle cx="80" cy="80" r="76" fill="url(#avatarGlow)" stroke="#ffffff" stroke-width="4" filter="url(#floatShadow)"/>
      <!-- Stylized silhouette & code glyphs -->
      <circle cx="80" cy="65" r="28" fill="#cbd5e1"/>
      <path d="M 38 135 C 42 100, 118 100, 122 135 Z" fill="#94a3b8"/>
      
      <!-- Floating Badge -->
      <rect x="15" y="140" width="130" height="24" rx="12" fill="#ffffff" stroke="#e5e5ea" stroke-width="1" filter="url(#floatShadow)"/>
      <circle cx="28" cy="152" r="3" fill="#10b981"/>
      <text x="82" y="155.5" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="9" fill="#18181b" font-weight="700" text-anchor="middle">Tharusha Sangeeth</text>
    </g>

    <!-- Bottom Feature Pills Banner -->
    <g transform="translate(30, 335)">
      <rect x="0" y="0" width="155" height="48" rx="16" fill="#ffffff" stroke="#e5e5ea" stroke-width="1"/>
      <text x="20" y="24" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" font-weight="700" fill="#18181b">⚡ Next.js 16</text>
      <text x="20" y="38" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="9" fill="#71717a">Turbopack &amp; SSR</text>

      <rect x="175" y="0" width="155" height="48" rx="16" fill="#ffffff" stroke="#e5e5ea" stroke-width="1"/>
      <text x="195" y="24" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" font-weight="700" fill="#18181b">🐳 Dockerized</text>
      <text x="195" y="38" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="9" fill="#71717a">Multi-stage Container</text>

      <rect x="350" y="0" width="165" height="48" rx="16" fill="#ffffff" stroke="#e5e5ea" stroke-width="1"/>
      <text x="370" y="24" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" font-weight="700" fill="#18181b">🐘 PostgreSQL</text>
      <text x="370" y="38" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="9" fill="#71717a">Prisma ORM Managed</text>

      <rect x="535" y="0" width="157" height="48" rx="16" fill="#ffffff" stroke="#e5e5ea" stroke-width="1"/>
      <text x="555" y="24" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" font-weight="700" fill="#18181b">☁️ Hetzner Cloud</text>
      <text x="555" y="38" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="9" fill="#71717a">Automated CI/CD</text>
    </g>
  </g>
</svg>
