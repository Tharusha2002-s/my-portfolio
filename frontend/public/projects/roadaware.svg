<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="raBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#022c22"/>
      <stop offset="100%" stop-color="#064e3b"/>
    </linearGradient>
    <linearGradient id="aiGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>
    <filter id="raShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#000000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Dark Emerald Background -->
  <rect width="800" height="500" rx="20" fill="url(#raBg)"/>

  <!-- Radar / Geospatial Grid Elements -->
  <g opacity="0.1" stroke="#34d399" stroke-width="1">
    <circle cx="400" cy="250" r="120" fill="none"/>
    <circle cx="400" cy="250" r="220" fill="none"/>
    <circle cx="400" cy="250" r="320" fill="none"/>
    <line x1="400" y1="0" x2="400" y2="500"/>
    <line x1="0" y1="250" x2="800" y2="250"/>
  </g>

  <!-- Browser Header Window -->
  <rect x="24" y="20" width="752" height="42" rx="12" fill="#064e3b" stroke="#047857" stroke-width="1"/>
  <circle cx="46" cy="41" r="5" fill="#ef4444"/>
  <circle cx="62" cy="41" r="5" fill="#f59e0b"/>
  <circle cx="78" cy="41" r="5" fill="#10b981"/>

  <rect x="230" y="27" width="340" height="28" rx="8" fill="#022c22" stroke="#047857" stroke-width="1"/>
  <text x="400" y="45" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" fill="#6ee7b7" text-anchor="middle" font-weight="500">🔒 https://github.com/Pathum-Piyumal/RoadAware</text>

  <rect x="645" y="30" width="115" height="22" rx="11" fill="#065f46" stroke="#10b981" stroke-width="1"/>
  <text x="702" y="45" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="10" fill="#a7f3d0" text-anchor="middle" font-weight="700">AI GEOSPATIAL</text>

  <!-- Main Viewport Canvas -->
  <g transform="translate(24, 74)">
    <rect width="752" height="406" rx="16" fill="#021a14" stroke="#047857" stroke-width="1"/>

    <!-- App Bar -->
    <g transform="translate(24, 18)">
      <circle cx="10" cy="10" r="8" fill="#10b981"/>
      <circle cx="10" cy="10" r="4" fill="#ffffff"/>
      <text x="28" y="15" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="14" font-weight="800" letter-spacing="1" fill="#ffffff">ROADAWARE AI</text>
      <text x="160" y="15" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="10" font-weight="600" fill="#34d399">REAL-TIME HAZARD &amp; SAFETY ENGINE</text>

      <!-- Live AI Detection Pill -->
      <rect x="530" y="0" width="170" height="24" rx="12" fill="#064e3b" stroke="#059669" stroke-width="1"/>
      <circle cx="544" cy="12" r="3.5" fill="#34d399"/>
      <text x="622" y="15.5" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="9.5" fill="#d1fae5" font-weight="600" text-anchor="middle">Computer Vision: Active</text>
    </g>

    <!-- Map & Camera Vision Dashboard Layout -->
    <g transform="translate(24, 52)">
      <!-- Left: Interactive GPS Map Viewport -->
      <g>
        <rect x="0" y="0" width="450" height="240" rx="16" fill="#03221b" stroke="#065f46" stroke-width="1" filter="url(#raShadow)"/>

        <!-- Simulated Road Network -->
        <path d="M 30 180 Q 150 140 220 170 T 420 80" fill="none" stroke="#0f766e" stroke-width="18" stroke-linecap="round"/>
        <path d="M 30 180 Q 150 140 220 170 T 420 80" fill="none" stroke="#2dd4bf" stroke-width="2" stroke-dasharray="8 6"/>

        <path d="M 120 30 Q 180 120 220 170 T 320 230" fill="none" stroke="#0f766e" stroke-width="14" stroke-linecap="round"/>
        <path d="M 120 30 Q 180 120 220 170 T 320 230" fill="none" stroke="#5eead4" stroke-width="1.5" stroke-dasharray="6 4"/>

        <!-- Hazard Pins on Map -->
        <!-- Hazard 1: Severe Pothole -->
        <g transform="translate(180, 140)">
          <circle cx="0" cy="0" r="14" fill="#ef4444" opacity="0.3"/>
          <circle cx="0" cy="0" r="7" fill="#ef4444"/>
          <rect x="12" y="-12" width="110" height="22" rx="6" fill="#1f2937" stroke="#ef4444" stroke-width="1"/>
          <text x="67" y="2.5" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="8.5" fill="#fecaca" font-weight="700" text-anchor="middle">⚠️ Pothole Defect #412</text>
        </g>

        <!-- Hazard 2: Road Obstruction -->
        <g transform="translate(340, 105)">
          <circle cx="0" cy="0" r="12" fill="#f59e0b" opacity="0.3"/>
          <circle cx="0" cy="0" r="6" fill="#f59e0b"/>
          <rect x="12" y="-12" width="100" height="22" rx="6" fill="#1f2937" stroke="#f59e0b" stroke-width="1"/>
          <text x="62" y="2.5" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="8.5" fill="#fef3c7" font-weight="700" text-anchor="middle">🚧 Road Obstacle</text>
        </g>

        <!-- Current Location Indicator -->
        <circle cx="90" cy="165" r="9" fill="#38bdf8"/>
        <circle cx="90" cy="165" r="4" fill="#ffffff"/>

        <!-- Map Controls overlay -->
        <rect x="14" y="14" width="130" height="24" rx="8" fill="#042f2e" stroke="#0d9488" stroke-width="1"/>
        <text x="79" y="30" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="9" fill="#ccfbf1" font-weight="600" text-anchor="middle">📍 Colombo Sector A-4</text>
      </g>

      <!-- Right: Computer Vision Telemetry Feed -->
      <g transform="translate(470, 0)">
        <!-- AI Vision Frame -->
        <rect x="0" y="0" width="234" height="150" rx="14" fill="#042f2e" stroke="#059669" stroke-width="1"/>
        
        <!-- Camera Frame Overlay -->
        <rect x="14" y="14" width="206" height="122" rx="8" fill="#021a14" stroke="#0f766e" stroke-width="1"/>
        <!-- AI Bounding Box -->
        <rect x="36" y="36" width="90" height="55" rx="4" fill="none" stroke="#10b981" stroke-width="2" stroke-dasharray="4 2"/>
        <rect x="36" y="24" width="75" height="14" rx="3" fill="#10b981"/>
        <text x="73" y="34" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="7.5" fill="#022c22" font-weight="800" text-anchor="middle">Pothole (98.4%)</text>

        <!-- Vision HUD info -->
        <text x="24" y="125" font-family="monospace" font-size="8" fill="#34d399">LAT: 6.9271° N  |  FPS: 45</text>

        <!-- Telemetry Stats Cards -->
        <g transform="translate(0, 162)">
          <rect x="0" y="0" width="110" height="78" rx="12" fill="#042f2e" stroke="#065f46" stroke-width="1"/>
          <text x="14" y="24" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="9.5" fill="#6ee7b7" font-weight="700">Resolved</text>
          <text x="14" y="52" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="20" fill="#ffffff" font-weight="800">1,248</text>
          <text x="14" y="68" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="8" fill="#a7f3d0">Municipal cases</text>

          <rect x="124" y="0" width="110" height="78" rx="12" fill="#042f2e" stroke="#065f46" stroke-width="1"/>
          <text x="138" y="24" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="9.5" fill="#6ee7b7" font-weight="700">AI Accuracy</text>
          <text x="138" y="52" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="20" fill="#ffffff" font-weight="800">98.4%</text>
          <text x="138" y="68" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="8" fill="#a7f3d0">Neural detection</text>
        </g>
      </g>
    </g>

    <!-- Bottom Tech Badges -->
    <g transform="translate(24, 312)">
      <rect x="0" y="0" width="704" height="68" rx="14" fill="#03251e" stroke="#064e3b" stroke-width="1"/>
      <text x="24" y="26" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" font-weight="700" fill="#a7f3d0">CORE AI &amp; FULL-STACK ARCHITECTURE</text>
      <text x="24" y="46" font-family="monospace" font-size="11" fill="#34d399">React 19  •  Vite  •  Leaflet Maps  •  Node.js  •  Express REST API  •  MySQL  •  Sequelize ORM</text>
    </g>
  </g>
</svg>
